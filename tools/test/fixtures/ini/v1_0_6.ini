; Open Thandor settings. The game rewrites this file when a setting changes in its menus.
; A missing key means the game's default; unknown keys are ignored.

[display]
; graphics adapter, 0 = the first (default 0)
adapter = 0
; screen width in pixels (default 640)
width = 2560
; screen height in pixels (default 480)
height = 1440
; colour depth in bits, always 32 (an older 16 is read as 32)
bits_per_pixel = 32
; renderer: vulkan (default), d3d12 or software
renderer = d3d12
; fullscreen (default), borderless or window
display_mode = fullscreen

[graphics]
; Vulkan / DirectX 12 UI scale: auto (default; the largest whole factor that keeps the UI at least 1280x720) or 1, 2, 3; the UI resolution is the display mode divided by it, the window / fullscreen size stays the mode
ui_scale = 2
; vsync: on (default; frames wait for the display's refresh, no tearing) or off
vsync = off
; frame rate limit in frames per second: 0 (default, no limit), 60, 120, 144; at least 60 recommended (below 60 the game runs slower, its steps wait for drawn frames)
frame_limit = 144

[sound]
; sound effects volume, 0..32768 = 0..100 % (default 32768); here 50.0 %
effects_volume = 16384

[game]
; player name, at most 20 characters
player_name = "Spieler"
; text language as telephone country code (49 German, 44 English, ...), 0 = from Windows
language_country_code = 0
