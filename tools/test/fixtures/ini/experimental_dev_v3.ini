; Open Thandor settings. The game rewrites this file when a setting changes in its menus.
; A missing key means the game's default; unknown keys and sections are kept as they are.

[display]
; graphics adapter, 0 = the first (default 0)
adapter = 0
; screen width in pixels (default 640)
width = 1920
; screen height in pixels (default 480)
height = 1080
; colour depth in bits, always 32 (an older 16 is read as 32)
bits_per_pixel = 32
; renderer: vulkan (default), d3d12 or software
renderer = vulkan
; fullscreen (default), borderless or window
display_mode = borderless

[graphics]
; terrain shading (default true)
shading = true
; shading grid half size (default 32)
shading_grid_half_size = 128
; shading texture size, 2 x shading_grid_half_size (default 64)
shading_texture_size = 256
; shading depth (default 16)
shading_depth = 32
; texture quality: high, medium or low
texture_quality = high
; model detail distance, 8.8 fixed point (default 65536)
model_detail = 262144
; Vulkan / DirectX 12 triangles: smooth (default; sub-pixel, perspective-correct like the original's Direct3D) or exact (the software renderer's look)
gpu_rasterization = smooth
; Vulkan / DirectX 12 UI scale: auto (default; the largest whole factor that keeps the UI at least 1280x720) or 1, 2, 3; the UI resolution is the display mode divided by it, the window / fullscreen size stays the mode
ui_scale = auto
; vsync: on (default; frames wait for the display's refresh, no tearing) or off
vsync = on
; frame rate limit in frames per second: 0 (default, no limit), 60, 120, 144; at least 60 recommended (below 60 the game runs slower, its steps wait for drawn frames)
frame_limit = 0

[sound]
; sound effects (default true)
effects = true
; music (default true)
music = true
; swap the left and right channel (default false)
reverse_stereo = false
; sound effects volume, 0..32768 = 0..100 % (default 32768); here 75.0 %
effects_volume = 24576
; music volume, 0..32768 = 0..100 % (default 32768); here 50.0 %
music_volume = 16384
; movie volume, 0..32768 = 0..100 % (default 32768); here 100.0 %
movie_volume = 32768
; second movie volume, 0..32768 = 0..100 % (default 32768); here 100.0 %
movie_alternate_volume = 32768

[game]
; game speed in percent (default 100)
speed_percent = 100
; map scroll speed (default 32)
scroll_step = 32
; bits: 0x1 automatic zoom off, 0x2 automatic rotation off, 0x4 right button does not scroll / side panel hidden (default 0x0)
map_mouse_options = 0x0
; bits: 0x1 link rotation with zoom, 0x2 link rotation with tilt, 0x4 hide panel (default 0x0)
link_panel_options = 0x2
; player name, at most 20 characters
player_name = "Jürgen"
; name of a hosted network game, at most 20 characters
game_name = "Thandorspiel"
; the text language for Open Thandor 1.0.7 and older, as telephone country code (0 = from Windows); language below takes precedence
language_country_code = 49
; text language: auto (default; from Windows), de, en, fr, it or es (another telephone country code as a number); the game's own texts are German for de, English otherwise
language = de
; unit pathfinding and movement in single player: improved (default; units drive curves, wait for and give way to each other) or original (exactly the original game's movement); a network game always agrees on one mode
pathing = original
; objective box at the top left of the game (the mission objective and its progress): on (default) or off
objective_overlay = off
; save a single player game every minute of play to save\autosave.sve (always the same file): on (default) or off
autosave = on
; "Original Thandor": off (default) or on; on plays like the original game: every open-thandor addition (pathing, objective box, autosave, campaign map, movie loudness, own maps, key bindings) behaves as in the original, their own settings are kept for when it is off again; bug and crash fixes stay
original_thandor = on

[network]
; player count of a hosted network game (default 4)
players = 4

[keys]
; key bindings: action = keys (Ctrl, Alt, Shift + key; several joined with ", "; none = unbound)
; written in full once one differs from the defaults; without this section the defaults apply
objectives = F1
save = F2
leave_game = Alt+Q
pause = P, Pause
faster = G
slower = Alt+G
side_panel = Tab
chat = Enter
message_window = C
score_overview = O
info_line = Ctrl+I
screenshot = Print
notification_go = Space
notification_back = Backspace
objective_toggle = Z
group_select = 1..8
group_select_add = Shift+1..8
group_store = Ctrl+1..8, Alt+1..8
group_store_add = Ctrl+Shift+1..8, Alt+Shift+1..8
stop = Alt+Shift+S
stop_movement = Shift+S
cancel_attack = Alt+S
self_destruct = Alt+D
select_airports = A
upgrade_page = F
camera_left = Left
camera_right = Right
camera_up = Up
camera_down = Down
camera_tilt_minus = PageUp
camera_tilt_plus = PageDown
camera_rotate_minus = Insert
camera_rotate_plus = Delete
camera_zoom_in = Home
camera_zoom_out = End
camera_selection = Num5
camera_hq = B
camera_notification = Alt+Space
camera_free = Alt+C
menu_leave = Alt+Q
