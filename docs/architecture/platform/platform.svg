<a href="../../../src/platform/bootstrap/"><g>
<rect x="40" y="180" width="560" height="220" rx="10" fill="#e9edf2" stroke="#4b5d73" stroke-width="2"/>
<text x="54" y="205" class="t">bootstrap</text>
<text x="588" y="204" class="f" text-anchor="end">4 files · 3k lines</text>
<text x="54" y="224" class="d">WinMain: crash and hang reports, start-up tables, then a self-test</text>
<text x="54" y="239" class="d">or ProcessEntry: priority, command line, one instance, main window.</text>
<text x="54" y="254" class="d">ProcessEntry_RunGame: heap, files, locale, SDL video / input / audio,</text>
<text x="54" y="269" class="d">network, settings, first display mode 640x480, UiRuntime_Initialize.</text>
<text x="54" y="284" class="d">Game_Run: Game_LoadCoreAssets, Game_PlayIntroMovies, saved mode,</text>
<text x="54" y="299" class="d">Frontend_MainLoop; then Runtime_Shutdown, SdlPlatform_Quit.</text>
<rect x="54" y="310" width="64" height="19" rx="9" fill="#fff" stroke="#4b5d73" stroke-opacity="0.6"/>
<text x="61" y="324" class="m">main.cpp</text>
