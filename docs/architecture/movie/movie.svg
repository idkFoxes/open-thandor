<a href="../../../src/movie/runtime/"><g>
<rect x="40" y="200" width="660" height="250" rx="10" fill="#f3ecfb" stroke="#8a5ac8" stroke-width="2"/>
<text x="54" y="225" class="t">playback.cpp</text>
<text x="688" y="224" class="f" text-anchor="end">playback</text>
<text x="54" y="244" class="d">Opens an FLM (loose movie folder, mounted package, exe folder), loads the header and the</text>
<text x="54" y="259" class="d">video stream, picks one embedded soundtrack at random, keeps g_ActiveMovie as a one-frame</text>
<text x="54" y="274" class="d">texture; a refill worker thread streams large movies. One movie open at a time.</text>
<rect x="54" y="285" width="77" height="19" rx="9" fill="#fff" stroke="#8a5ac8" stroke-opacity="0.6"/>
<text x="61" y="299" class="m">Movie_Open</text>
<rect x="137" y="285" width="127" height="19" rx="9" fill="#fff" stroke="#8a5ac8" stroke-opacity="0.6"/>
