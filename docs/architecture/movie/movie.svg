<rect x="54" y="309" width="165" height="19" rx="9" fill="#fff" stroke="#8a5ac8" stroke-opacity="0.6"/>
<text x="61" y="323" class="m">Movie_GetFrameDimensions</text>
<rect x="225" y="309" width="146" height="19" rx="9" fill="#fff" stroke="#8a5ac8" stroke-opacity="0.6"/>
<text x="232" y="323" class="m">Movie_SetAudioGainQ15</text>
<rect x="378" y="309" width="140" height="19" rx="9" fill="#fff" stroke="#8a5ac8" stroke-opacity="0.6"/>
<text x="384" y="323" class="m">IntroMovie_TimerTick</text>
</g></a>
