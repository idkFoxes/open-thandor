<text x="20" y="32" style="font-size:22px;font-weight:700;fill:#111">movie — FLM playback and encoding</text>
<text x="20" y="52" class="d">One module, src/movie/runtime/ (headers in include/thandor/movie/runtime/); the boxes are its source files. Arrows are real call paths; click a box for its sources or page.</text>
