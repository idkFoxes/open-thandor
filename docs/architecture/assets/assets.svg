<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 850" width="1280" height="850" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><style>.t{font-size:17px;font-weight:700;fill:#1d1d1f}.d{font-size:12px;fill:#333}.m{font-size:11px;fill:#222}.f{font-size:11px;fill:#666}.l{font-size:11.5px;fill:#333;font-style:italic}.h{font-size:11px;font-weight:700;fill:#888;letter-spacing:1.5px}</style></defs>
<rect width="1280" height="850" fill="#fff"/>
<text x="20" y="32" style="font-size:22px;font-weight:700;fill:#111">assets — PCK packages and catalogs</text>
<text x="20" y="52" class="d">src/assets/: the package layer reads (and for savegames writes) PCK archives; the catalogs register the loaded records by id for lookups. Click a box for its sources.</text>
<rect x="60" y="80" width="560" height="40" rx="8" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="340.0" y="104.0" class="d" text-anchor="middle">Game files: PCK archives (daten, modelle, graphik, ..., patchNN) · loose files · maps\*.thmap</text>
<a href="../platform/README.md"><g>
<rect x="660" y="80" width="580" height="40" rx="8" fill="#e9edf2" stroke="#4b5d73" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="950.0" y="104.0" class="d" text-anchor="middle">platform — CoreAssets_MountPackages at start-up, file I/O (g_FileSystem*)</text>
</g></a>
<a href="../../../src/assets/package/"><g>
<rect x="60" y="150" width="1180" height="112" rx="10" fill="#f0f0f0" stroke="#7a7a7a" stroke-width="2"/>
<text x="74" y="175" class="t">package</text>
<text x="1228" y="174" class="f" text-anchor="end">4 files</text>
<text x="74" y="194" class="d">Mount table of 1024 slots: Package_Mount reads each archive directory; Package_FindEntryAcrossMounts searches the slots in mount order (earlier mounts win), a loose file next to the exe is the fallback.</text>
<text x="74" y="209" class="d">Package_DecodeEntryInto stages the packed bytes in the 8 MiB scratch buffer and decodes by method: 0 Huffman/RLE, 1 stored, 2 field grid. Package_UpsertEntry / DeleteEntry rewrite save archives.</text>
<rect x="74" y="220" width="83" height="19" rx="9" fill="#fff" stroke="#7a7a7a" stroke-opacity="0.6"/>
<text x="81" y="234" class="m">runtime.cpp</text>
<rect x="163" y="220" width="71" height="19" rx="9" fill="#fff" stroke="#7a7a7a" stroke-opacity="0.6"/>
<text x="170" y="234" class="m">codec.cpp</text>
<rect x="240" y="220" width="134" height="19" rx="9" fill="#fff" stroke="#7a7a7a" stroke-opacity="0.6"/>
<text x="247" y="234" class="m">resource_loader.cpp</text>
<rect x="380" y="220" width="121" height="19" rx="9" fill="#fff" stroke="#7a7a7a" stroke-opacity="0.6"/>
<text x="387" y="234" class="m">archive_write.cpp</text>
</g></a>
<path d="M340,120 L340,150" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#ar)" marker-start="url(#ar)"/>
