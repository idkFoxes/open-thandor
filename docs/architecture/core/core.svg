<a href="../../../include/thandor/core/"><g>
<rect x="60" y="690" width="1180" height="106" rx="10" fill="#f0f0f0" stroke="#7a7a7a" stroke-width="2"/>
<text x="74" y="715" class="t">core (base headers)</text>
<text x="74" y="734" class="d">Header-only basics: Ptr32&lt;T&gt; 32-bit pointer fields of the original layouts, flag enums (THANDOR_FLAG_ENUM), THANDOR_SLOT function slots, byte views, MMX colour lanes, x86 helpers.</text>
<text x="74" y="749" class="d">layout_checks.cpp: compile-time static_asserts that the type-header structs keep their 32-bit sizes and pointer offsets.</text>
<rect x="74" y="760" width="58" height="19" rx="9" fill="#fff" stroke="#7a7a7a" stroke-opacity="0.6"/>
