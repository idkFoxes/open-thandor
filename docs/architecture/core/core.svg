<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><style>.t{font-size:17px;font-weight:700;fill:#1d1d1f}.d{font-size:12px;fill:#333}.m{font-size:11px;fill:#222}.f{font-size:11px;fill:#666}.l{font-size:11.5px;fill:#333;font-style:italic}.h{font-size:11px;font-weight:700;fill:#888;letter-spacing:1.5px}</style></defs>
<rect width="1280" height="820" fill="#fff"/>
<text x="20" y="32" style="font-size:22px;font-weight:700;fill:#111">core — settings, errors, memory, maths, strings</text>
<text x="20" y="52" class="d">src/core/: services every area uses. Arrows show the main calls; memory, text and the base headers are used nearly everywhere and have no arrows. Click a box for its sources.</text>
<rect x="60" y="80" width="300" height="40" rx="8" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="210.0" y="104.0" class="d" text-anchor="middle">thandor.ini · thandor.dat (read only)</text>
<a href="../platform/README.md"><g>
<rect x="400" y="80" width="440" height="40" rx="8" fill="#e9edf2" stroke="#4b5d73" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="620.0" y="104.0" class="d" text-anchor="middle">platform — bootstrap starts core up; file system</text>
</g></a>
<a href="../assets/README.md"><g>
<rect x="880" y="80" width="360" height="40" rx="8" fill="#f0f0f0" stroke="#7a7a7a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="1060.0" y="104.0" class="d" text-anchor="middle">assets — text pages, last error path</text>
</g></a>
<a href="../../../src/core/settings/"><g>
<rect x="60" y="160" width="560" height="200" rx="10" fill="#f0f0f0" stroke="#7a7a7a" stroke-width="2"/>
<text x="74" y="185" class="t">settings</text>
<text x="608" y="184" class="f" text-anchor="end">2 files</text>
<text x="74" y="204" class="d">256-byte settings image: the 200 bytes of the original thandor.dat</text>
<text x="74" y="219" class="d">plus open-thandor dwords; PersistentSettings_Read returns the caller's</text>
<text x="74" y="234" class="d">default for a dword not present. Load parses thandor.ini (current dir,</text>
<text x="74" y="249" class="d">then exe dir), else migrates thandor.dat. Key table with a range per</text>
<text x="74" y="264" class="d">key; other modules register own sections ([keys]); unknown keys and</text>
<text x="74" y="279" class="d">sections are kept. Flush writes the ini. original_mode.cpp: the</text>
<text x="74" y="294" class="d">"Original Thandor" switch; OtFeature_Active gates the additions.</text>
<rect x="74" y="305" width="102" height="19" rx="9" fill="#fff" stroke="#7a7a7a" stroke-opacity="0.6"/>
<text x="81" y="319" class="m">persistent.cpp</text>
<rect x="182" y="305" width="121" height="19" rx="9" fill="#fff" stroke="#7a7a7a" stroke-opacity="0.6"/>
<text x="189" y="319" class="m">original_mode.cpp</text>
<rect x="309" y="305" width="146" height="19" rx="9" fill="#fff" stroke="#7a7a7a" stroke-opacity="0.6"/>
<text x="316" y="319" class="m">settings/persistent.h</text>
<rect x="74" y="329" width="165" height="19" rx="9" fill="#fff" stroke="#7a7a7a" stroke-opacity="0.6"/>
<text x="81" y="343" class="m">settings/original_mode.h</text>
<rect x="245" y="329" width="115" height="19" rx="9" fill="#fff" stroke="#7a7a7a" stroke-opacity="0.6"/>
<text x="252" y="343" class="m">settings/types.h</text>
</g></a>
<a href="../../../src/core/error/"><g>
<rect x="660" y="160" width="580" height="200" rx="10" fill="#f0f0f0" stroke="#7a7a7a" stroke-width="2"/>
<text x="674" y="185" class="t">error</text>
<text x="1228" y="184" class="f" text-anchor="end">1 file</text>
<text x="674" y="204" class="d">ErrorSystem_Init points both handlers at FatalError_Exit and loads</text>
<text x="674" y="219" class="d">texte\error.str as text page 0. FatalError_Exit(value, failed) passes</text>
<text x="674" y="234" class="d">the value through, or FatalError_ShowAndExit builds the message (error</text>
<text x="674" y="249" class="d">code or rich-text stream, last path, three details), shuts the game</text>
<text x="674" y="264" class="d">down and exits. Entered at most once.</text>
<rect x="674" y="275" width="83" height="19" rx="9" fill="#fff" stroke="#7a7a7a" stroke-opacity="0.6"/>
<text x="681" y="289" class="m">runtime.cpp</text>
<rect x="763" y="275" width="108" height="19" rx="9" fill="#fff" stroke="#7a7a7a" stroke-opacity="0.6"/>
<text x="770" y="289" class="m">error/runtime.h</text>
<rect x="878" y="275" width="96" height="19" rx="9" fill="#fff" stroke="#7a7a7a" stroke-opacity="0.6"/>
<text x="885" y="289" class="m">error/types.h</text>
</g></a>
<path d="M210,120 L210,160" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#ar)" marker-start="url(#ar)"/>
<text x="217" y="143" class="l" text-anchor="start">read · write (.tmp, then replace)</text>
<path d="M500,120 L500,160" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#ar)" marker-start="url(#ar)"/>
<text x="507" y="143" class="l" text-anchor="start">PersistentSettings_Load · file I/O</text>
<path d="M760,120 L760,160" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<text x="767" y="143" class="l" text-anchor="start">ErrorSystem_Init</text>
<path d="M1060,160 L1060,120" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<text x="1067" y="143" class="l" text-anchor="start">error.str · TextResource_Resolve</text>
<a href="../../../src/core/math/"><g>
<rect x="60" y="410" width="420" height="160" rx="10" fill="#f0f0f0" stroke="#7a7a7a" stroke-width="2"/>
<text x="74" y="435" class="t">math</text>
<text x="468" y="434" class="f" text-anchor="end">6 files</text>
<text x="74" y="454" class="d">Q12 / Q28 fixed point (fixed_point.h); sine table built at</text>
<text x="74" y="469" class="d">start-up, atan2, vectors, 3x4 transforms, triangle solver,</text>
<text x="74" y="484" class="d">cubic splines (float). Random: two LCG streams, the</text>
<text x="74" y="499" class="d">session draws from the secondary one.</text>
<rect x="74" y="510" width="102" height="19" rx="9" fill="#fff" stroke="#7a7a7a" stroke-opacity="0.6"/>
<text x="81" y="524" class="m">fixed_trig.cpp</text>
<rect x="182" y="510" width="115" height="19" rx="9" fill="#fff" stroke="#7a7a7a" stroke-opacity="0.6"/>
<text x="189" y="524" class="m">fixed_vector.cpp</text>
<rect x="303" y="510" width="134" height="19" rx="9" fill="#fff" stroke="#7a7a7a" stroke-opacity="0.6"/>
<text x="310" y="524" class="m">fixed_transform.cpp</text>
<rect x="74" y="534" width="90" height="19" rx="9" fill="#fff" stroke="#7a7a7a" stroke-opacity="0.6"/>
<text x="81" y="548" class="m">geometry.cpp</text>
<rect x="170" y="534" width="77" height="19" rx="9" fill="#fff" stroke="#7a7a7a" stroke-opacity="0.6"/>
<text x="177" y="548" class="m">spline.cpp</text>
<rect x="253" y="534" width="77" height="19" rx="9" fill="#fff" stroke="#7a7a7a" stroke-opacity="0.6"/>
<text x="260" y="548" class="m">random.cpp</text>
</g></a>
<a href="../../../src/core/memory/"><g>
<rect x="520" y="410" width="340" height="160" rx="10" fill="#f0f0f0" stroke="#7a7a7a" stroke-width="2"/>
<text x="534" y="435" class="t">memory</text>
<text x="848" y="434" class="f" text-anchor="end">2 files</text>
<text x="534" y="454" class="d">96 MiB arena from a private heap (ArenaHeap_Init),</text>
<text x="534" y="469" class="d">first fit in 32-byte steps; g_MemoryApi alloc /</text>
<text x="534" y="484" class="d">free is used by every area. Runtime_Shutdown</text>
<text x="534" y="499" class="d">flushes the settings and shuts the subsystems down.</text>
<rect x="534" y="510" width="96" height="19" rx="9" fill="#fff" stroke="#7a7a7a" stroke-opacity="0.6"/>
<text x="541" y="524" class="m">allocator.cpp</text>
<rect x="636" y="510" width="134" height="19" rx="9" fill="#fff" stroke="#7a7a7a" stroke-opacity="0.6"/>
<text x="643" y="524" class="m">synchronization.cpp</text>
</g></a>
<a href="../../../src/core/text/"><g>
<rect x="900" y="410" width="340" height="160" rx="10" fill="#f0f0f0" stroke="#7a7a7a" stroke-width="2"/>
<text x="914" y="435" class="t">text</text>
<text x="1228" y="434" class="f" text-anchor="end">2 files</text>
<text x="914" y="454" class="d">UTF-16 paths: WidePath_SetExtensionCode,</text>
<text x="914" y="469" class="d">SplitParentAndLeaf, CombineDirectoryAndLeaf;</text>
<text x="914" y="484" class="d">number formatting, case-insensitive compare,</text>
<text x="914" y="499" class="d">narrow to UTF-16 copies.</text>
<rect x="914" y="510" width="64" height="19" rx="9" fill="#fff" stroke="#7a7a7a" stroke-opacity="0.6"/>
<text x="921" y="524" class="m">path.cpp</text>
<rect x="984" y="510" width="77" height="19" rx="9" fill="#fff" stroke="#7a7a7a" stroke-opacity="0.6"/>
<text x="991" y="524" class="m">string.cpp</text>
</g></a>
