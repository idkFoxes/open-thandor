</g></a>
<path d="M500,360 L500,610" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<text x="494" y="485" class="l" text-anchor="middle" transform="rotate(-90 494 485)">PersistentSettings_Read / Write</text>
<path d="M880,360 L880,610" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
