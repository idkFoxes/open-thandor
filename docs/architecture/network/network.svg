</g></a>
<a href="../../../src/network/backend/"><g>
<rect x="60" y="420" width="560" height="110" rx="10" fill="#fde8ef" stroke="#c84a76" stroke-width="2"/>
<text x="74" y="445" class="t">backend</text>
<text x="608" y="444" class="f" text-anchor="end">2 files</text>
<text x="74" y="464" class="d">WinSock 1.1 (wsock32.dll) bound at start-up; eight backend slots:</text>
<text x="74" y="479" class="d">select, cleanup, open/bind, close, receive, send, parse, format address.</text>
<rect x="74" y="490" width="83" height="19" rx="9" fill="#fff" stroke="#c84a76" stroke-opacity="0.6"/>
<text x="81" y="504" class="m">runtime.cpp</text>
