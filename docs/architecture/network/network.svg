<rect x="723" y="297" width="77" height="19" rx="9" fill="#fff" stroke="#c84a76" stroke-opacity="0.6"/>
<text x="730" y="311" class="m">cipher.cpp</text>
<rect x="806" y="297" width="146" height="19" rx="9" fill="#fff" stroke="#c84a76" stroke-opacity="0.6"/>
<text x="813" y="311" class="m">scenario_transfer.cpp</text>
<rect x="958" y="297" width="102" height="19" rx="9" fill="#fff" stroke="#c84a76" stroke-opacity="0.6"/>
