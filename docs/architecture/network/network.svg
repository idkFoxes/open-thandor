<text x="1220" y="204" class="h" text-anchor="end">NETWORK</text>
<a href="../../../src/network/protocol/"><g>
<rect x="60" y="212" width="1160" height="126" rx="10" fill="#fde8ef" stroke="#c84a76" stroke-width="2"/>
<text x="74" y="237" class="t">protocol</text>
<text x="1208" y="236" class="f" text-anchor="end">8 files · 4.1k lines</text>
<text x="74" y="256" class="d">Lobby (discovery, session list, join), session-start snapshot exchange, in-game lockstep command batches,</text>
<text x="74" y="271" class="d">command queues and dispatch tables, chunked mailbox transfer (maps, catalog), packet cipher, receive timer.</text>
<text x="74" y="286" class="d">Not in the original: pathing-mode negotiation in the lobby; local commands pass the game recorder.</text>
<rect x="74" y="297" width="71" height="19" rx="9" fill="#fff" stroke="#c84a76" stroke-opacity="0.6"/>
<text x="81" y="311" class="m">lobby.cpp</text>
