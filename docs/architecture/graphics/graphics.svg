</g></a>
<a href="../world/README.md"><g>
<rect x="310" y="516" width="290" height="44" rx="8" fill="#fff6d6" stroke="#c9a227" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="455.0" y="542.0" class="d" text-anchor="middle">world (field grid, model nodes, lights)</text>
</g></a>
<a href="../../../src/graphics/backend/"><g>
<rect x="650" y="476" width="500" height="156" rx="10" fill="#e6f6ec" stroke="#2f9a57" stroke-width="2"/>
<text x="664" y="501" class="t">backend</text>
<text x="1138" y="500" class="f" text-anchor="end">6 files</text>
<text x="664" y="520" class="d">Software renderer: 40 triangle handlers over the sorted queue into the</text>
<text x="664" y="535" class="d">framebuffer and depth buffer; 32-bit blits and fills; bilinear scaling,</text>
<text x="664" y="550" class="d">minimap; depth buffer on mode switch; display-mode table checks.</text>
<rect x="664" y="561" width="134" height="19" rx="9" fill="#fff" stroke="#2f9a57" stroke-opacity="0.6"/>
<text x="671" y="575" class="m">software_rasterizer</text>
<rect x="804" y="561" width="96" height="19" rx="9" fill="#fff" stroke="#2f9a57" stroke-opacity="0.6"/>
<text x="811" y="575" class="m">software_blit</text>
<rect x="906" y="561" width="153" height="19" rx="9" fill="#fff" stroke="#2f9a57" stroke-opacity="0.6"/>
<text x="913" y="575" class="m">software_texture_scale</text>
<rect x="664" y="585" width="146" height="19" rx="9" fill="#fff" stroke="#2f9a57" stroke-opacity="0.6"/>
<text x="671" y="599" class="m">software_display_mode</text>
<rect x="816" y="585" width="96" height="19" rx="9" fill="#fff" stroke="#2f9a57" stroke-opacity="0.6"/>
<text x="823" y="599" class="m">display_modes</text>
<rect x="918" y="585" width="64" height="19" rx="9" fill="#fff" stroke="#2f9a57" stroke-opacity="0.6"/>
<text x="925" y="599" class="m">software</text>
</g></a>
<a href="../platform/README.md"><g>
<rect x="650" y="680" width="270" height="48" rx="8" fill="#e9edf2" stroke="#4b5d73" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="785.0" y="708.0" class="d" text-anchor="middle">platform/sdl3 video.cpp — SdlVideo_Present</text>
</g></a>
<rect x="960" y="680" width="190" height="48" rx="8" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="1055.0" y="708.0" class="d" text-anchor="middle">Display (window)</text>
<a href="../platform/README.md"><g>
<rect x="310" y="778" width="930" height="48" rx="8" fill="#e9edf2" stroke="#4b5d73" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="775.0" y="806.0" class="d" text-anchor="middle">platform/sdl3 SDL GPU renderer (Vulkan / D3D12): gpu_renderer.cpp, gpu_ui2d.cpp, gpu_ui_textures.cpp</text>
</g></a>
<text x="40" y="608" class="f" text-anchor="start">Renderer selection (video.cpp): the saved renderer</text>
<text x="40" y="624" class="f" text-anchor="start">or OPEN_THANDOR_GPU. StartGpuDevice swaps the 3D slots</text>
<text x="40" y="640" class="f" text-anchor="start">g_GraphicsSetViewportAndClearDepth, ...DrawPrimitiveQueue</text>
<text x="40" y="656" class="f" text-anchor="start">and ...EndScene and sets the draw list to GPU record;</text>
<text x="40" y="672" class="f" text-anchor="start">StopGpuDevice puts the software ones back.</text>
<path d="M160,120 L160,196" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<text x="167" y="160" class="l" text-anchor="start">gfx, palette loads</text>
<path d="M415,120 L415,196" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<text x="422" y="150" class="l" text-anchor="start">terrain pass</text>
<path d="M700,120 L700,196" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<text x="707" y="146" class="l" text-anchor="start">projection, model passes,</text>
<text x="707" y="160" class="l" text-anchor="start">sort + draw the queue</text>
<path d="M1085,120 L1085,196" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<text x="1092" y="160" class="l" text-anchor="start">blits, fills, minimap</text>
<path d="M310,400 L280,400" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
